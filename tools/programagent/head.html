<title>Program Agent</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="static/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<script>(function(){var t=localStorage.getItem("theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
html{height:100%}
:root{
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sheet:#FFFFFF;
  --ground:#f7f8fa; --panel:#ffffff; --panel-2:#f1f3f6;
  --ink:#15181d; --ink-2:#4e5663; --ink-3:#8992a1;
  --rule:#d3d8e0; --rule-2:#e4e7ec;
  --accent:#15785c; --accent-soft:rgba(21,120,92,.12); --accent-ink:#0d5242;
  --fail:#b31b1b; --fail-soft:rgba(179,27,27,.10);
  --pass:#15785c; --pass-soft:rgba(21,120,92,.12);
  --shadow:0 1px 2px rgba(16,20,28,.04),0 8px 24px -12px rgba(16,20,28,.12);
}
:root[data-theme="dark"]{
  --ground:#0e131a; --panel:#111820; --panel-2:#141b24;
  --ink:#e7ecf3; --ink-2:#a3adbb; --ink-3:#6f7a89;
  --rule:#2c3644; --rule-2:#1f2733;
  --accent:#46b98f; --accent-soft:rgba(70,185,143,.14); --accent-ink:#8fe0c0;
  --fail:#e0776b; --fail-soft:rgba(224,119,107,.14);
  --pass:#46b98f; --pass-soft:rgba(70,185,143,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) clamp(258px,20vw,348px);grid-template-rows:auto minmax(0,1fr);height:100vh;min-height:560px}
body.embed .topbar{display:none}
body.embed .app{height:100vh;min-height:0}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.runcfg{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.cfg{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--rule);border-radius:3px;font-size:10.5px;letter-spacing:.02em;color:var(--ink-2);background:var(--panel-2)}
.cfg b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cfg .dot{width:5px;height:5px;border-radius:50%;background:var(--pass)}

.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px 14px 0 16px;gap:10px}
.sheet{position:relative;flex:1;min-height:0;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
.sheet svg{display:block;width:100%;height:100%}

/* figure elements: dim until the pulse has passed */
.el{opacity:.3;transition:opacity 520ms ease}
.el.lit{opacity:1}
.el.faded{opacity:.12}
.el.throb{animation:throb 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes throb{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.06)}}
#fig.all .el{opacity:1}
.el.pop{animation:pop .9s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.55);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.flyer{pointer-events:none}
.shutter{fill:#fff;animation:shutter .8s ease-out forwards;pointer-events:none}
@keyframes shutter{0%{opacity:.95}100%{opacity:0}}
.snapbg{fill:#fff;stroke:var(--pass);stroke-width:2;stroke-dasharray:6 5}

/* pulse */
.dot .halo{fill:url(#glow);opacity:.9}
.dot .core{fill:#fff;stroke:var(--accent);stroke-width:2.2}
.dot.fail .core{stroke:var(--fail)} .dot.fail .halo{fill:url(#glowFail)}
.dot.pass .core{stroke:var(--pass)} .dot.pass .halo{fill:url(#glowPass)}
.dot .trail{fill:var(--accent)} .dot.fail .trail{fill:var(--fail)} .dot.pass .trail{fill:var(--pass)}
.dot{transition:opacity .35s ease}
.ripple{fill:none;stroke:var(--accent);stroke-width:2;animation:ripple 900ms ease-out forwards;transform-box:fill-box;transform-origin:center}
.ripple.fail{stroke:var(--fail)} .ripple.pass{stroke:var(--pass)}
@keyframes ripple{0%{r:8;opacity:.9}100%{r:52;opacity:0}}
.frame{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 5;rx:5;opacity:0;transition:opacity .35s ease}
.frame.on{opacity:.85}
.frame.fail{stroke:var(--fail)} .frame.pass{stroke:var(--pass)}
.mark circle{fill:var(--pass);stroke:#fff;stroke-width:2}
.mark.fail circle{fill:var(--fail)}
.mark path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mark{animation:markpop .55s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
@keyframes markpop{0%{opacity:0;scale:.3}100%{opacity:1;scale:1}}

/* caption */
.sheetlabel{position:absolute;left:12px;top:11px;z-index:3;display:flex;align-items:baseline;gap:11px;max-width:min(62%,680px);padding:8px 13px;border-radius:4px;background:rgba(255,255,255,.92);border:1px solid #D3DCDC;box-shadow:0 2px 8px -4px rgba(16,20,28,.22);pointer-events:none}
.sheetlabel .n{font:600 11.5px/1 var(--mono);color:#15785c;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.sheetlabel .t{font:600 17px/1.25 var(--sans);color:#121A1A;letter-spacing:-.01em}
.sheetlabel .x{font:700 10.5px/1 var(--mono);color:#0d5242;background:#DCEDE3;border-radius:3px;padding:4px 7px;white-space:nowrap}
.sheetlabel .x[hidden]{display:none}

/* per-revision figures of the real run: a strip along the bottom; the figure slides up to make room */
.sheet svg{transition:height .45s ease}
.sheet.mon svg{height:calc(100% - 98px)}
.metrics{position:absolute;left:12px;right:12px;bottom:10px;z-index:3;display:flex;align-items:center;gap:16px;padding:8px 14px 9px;border-radius:4px;background:rgba(255,255,255,.96);border:1px solid #D3DCDC;box-shadow:0 2px 8px -4px rgba(16,20,28,.22);opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.metrics.on{opacity:1;transform:none}
.metrics .mh{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-right:14px;border-right:1px solid #E6ECEC;min-width:150px}
.metrics .mt{font:600 12.5px/1.25 var(--sans);color:#121A1A}
.metrics .mk{font:500 9px/1 var(--mono);color:#7E9191;letter-spacing:.06em;text-transform:uppercase}
.metrics #m-rows{flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.metrics #m-rows[hidden]{display:none}
.metrics .row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"lb lb" "tr tr" "v dl";align-items:center;gap:3px 6px;min-width:0}
.metrics .lb{grid-area:lb;font:500 10.5px/1.2 var(--sans);color:#445555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metrics .tr{grid-area:tr;position:relative;height:7px;background:#E6ECEC;border-radius:4px;overflow:hidden}
.metrics .bv{display:block;height:100%;width:0;background:#15785c;border-radius:0 3px 3px 0;transition:width 1400ms cubic-bezier(.22,.61,.36,1)}
.metrics .gh{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#121A1A;opacity:0;transition:opacity .3s}
.metrics .gh.on{opacity:.9}
.metrics .v{grid-area:v;font:600 11.5px/1 var(--mono);color:#121A1A;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.metrics .dl{grid-area:dl;font:700 9.5px/1 var(--mono);color:#0d5242;background:#DCEDE3;border-radius:3px;padding:3px 5px;opacity:0;transform:translateX(-4px);transition:opacity .35s,transform .35s;white-space:nowrap;justify-self:end}
.metrics .dl.on{opacity:1;transform:none}
.metrics .dl.down{color:#7a2a22;background:#F6E0DC}
.metrics.bump{animation:bump 2.4s ease-out;transform-origin:center bottom}
@keyframes bump{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(21,120,92,0),0 2px 8px -4px rgba(16,20,28,.22)}12%{transform:scale(1.025);box-shadow:0 0 0 5px rgba(21,120,92,.35),0 12px 30px -10px rgba(16,20,28,.4)}40%{transform:scale(1.025);box-shadow:0 0 0 5px rgba(21,120,92,.35),0 12px 30px -10px rgba(16,20,28,.4)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(21,120,92,0),0 2px 8px -4px rgba(16,20,28,.22)}}
.mfinal{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,auto)) 1fr;gap:18px;align-items:center}
.mfinal[hidden]{display:none}
.mfinal .frow{display:contents}
.mfinal .fk2{font:600 9px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#0d5242}
.mfinal .fv2{font:700 22px/1.1 var(--sans);color:#121A1A;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.mfinal .fv3{font:600 12.5px/1.2 var(--mono);color:#121A1A;margin-top:5px;font-variant-numeric:tabular-nums}
.mfinal .fn{font:400 10.5px/1.4 var(--sans);color:#7E9191;border-left:1px dashed #D3DCDC;padding-left:14px}

/* hover examples */
.el.hov{cursor:help}
.pop{position:absolute;z-index:6;width:min(46%,470px);max-height:calc(100% - 20px);overflow:auto;background:#fff;border:1px solid #CBD6D6;border-radius:6px;box-shadow:0 2px 6px rgba(16,20,28,.08),0 22px 48px -18px rgba(16,20,28,.42);padding:10px 12px 11px}
.pop[hidden]{display:none}
.pop .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pop .pt{font:600 13.5px/1.3 var(--sans);color:#121A1A;letter-spacing:-.01em}
.pop .px{all:unset;cursor:pointer;font:400 16px/1 var(--sans);color:#7E9191;padding:0 4px}
.pop .px:hover{color:#121A1A}
.pop .ps{font:400 10.5px/1.45 var(--sans);color:#5d6d6d;margin:3px 0 8px}
.pop .pl{font:600 9.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:#0E6B6B;margin:9px 0 4px}
.pop .pc{margin:0;padding:9px 11px;background:#111c1b;border-radius:5px;font:400 11px/1.55 var(--mono);color:#dde8e6;white-space:pre;overflow-x:auto;tab-size:4}
.pop .pc .ln{display:block;padding:0 6px;margin:0 -6px;border-radius:2px}
.pop .pc .cm{color:#86a09c}
.pop .pn{font:400 10.5px/1.45 var(--sans);color:#7E9191;margin-top:8px}
@media (max-width:880px){ .pop{width:min(92%,470px)} }

/* transport + rail */
.transport{display:flex;align-items:center;gap:10px;padding:0 2px 12px}
.ticks{display:flex;gap:2px;flex:1;min-width:0}
.tick{flex:1;height:14px;border:0;padding:0;background:transparent;cursor:pointer;position:relative}
.tick::after{content:"";position:absolute;inset:5px 0;background:var(--rule);border-radius:1px;transition:background .2s,inset .2s}
.tick[data-state="done"]::after{background:var(--ink-3)}
.tick[data-state="now"]::after{background:var(--accent);inset:3px 0}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.btn{appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer;padding:6px 10px;font:500 11.5px/1 var(--sans);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:88px;justify-content:center}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.counter{font:500 11px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--rule)}
.railhead{padding:12px 15px 9px;border-bottom:1px solid var(--rule-2);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.railhead .k{font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.railhead .v{font:500 10.5px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.steps{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* Embedded, the rail is a display, not a scroller: it holds every beat, so
   it would take about three of its own heights of wheel before the host
   page moved at all. overflow:hidden still scrolls programmatically, which
   is how the active beat follows along. Full screen keeps it scrollable. */
body.embed .steps{overflow:hidden}
.phase{display:flex;align-items:center;gap:8px;padding:11px 15px 5px;font:600 9px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.phase::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.beat{display:grid;grid-template-columns:24px 1fr;gap:9px;width:100%;text-align:left;padding:7px 15px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;align-items:start}
.beat:hover{background:var(--panel-2)}
.beat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.beat .n{font:500 10px/1.55 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.beat .t{font-size:12.5px;line-height:1.38;color:var(--ink-2);text-wrap:balance}
.beat .d{display:none;font-size:11.5px;line-height:1.55;color:var(--ink-2);margin-top:5px}
.beat .tags{display:none;gap:5px;margin-top:6px;flex-wrap:wrap}
.beat[data-state="done"] .n{color:var(--accent)} .beat[data-state="done"] .t{color:var(--ink)}
.beat[data-state="now"]{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
.beat[data-state="now"] .n{color:var(--accent);font-weight:600} .beat[data-state="now"] .t{color:var(--ink);font-weight:600}
.beat[data-state="now"] .d{display:block} .beat[data-state="now"] .tags{display:flex}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;font:600 9px/1.6 var(--mono);letter-spacing:.05em;background:var(--accent-soft);color:var(--accent-ink)}
.tag.fail{background:var(--fail-soft);color:var(--fail)} .tag.pass{background:var(--pass-soft);color:var(--pass)}
.railfoot{padding:9px 15px;border-top:1px solid var(--rule-2);font-size:10.5px;color:var(--ink-3);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
kbd{font:500 9.5px/1 var(--mono);border:1px solid var(--rule);border-radius:2px;padding:3px 4px;color:var(--ink-2);background:var(--panel-2)}
@media (prefers-reduced-motion: reduce){ .el,.frame,.metrics .bv{transition-duration:1ms !important} .el.throb,.ripple{animation:none} }
@media (max-width:880px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,56vh) minmax(0,1fr);height:auto;min-height:100vh}
  .rail{border-left:0;border-top:1px solid var(--rule)} .runcfg{margin-left:0}
  .sheetlabel{max-width:80%} .sheetlabel .t{font-size:14px} .metrics{display:none}
}
</style>
